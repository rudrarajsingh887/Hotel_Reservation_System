<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-label="Animated terminal demo of the Hotel Reservation app" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#1c2333"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="798" height="338" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <path d="M1 15 Q1 1 15 1 H785 Q799 1 799 15 V44 H1 Z" fill="url(#tbar)"/>
  <circle cx="26" cy="23" r="7" fill="#ff5f56"/>
  <circle cx="48" cy="23" r="7" fill="#ffbd2e"/>
  <circle cx="70" cy="23" r="7" fill="#27c93f"/>
  <text x="400" y="28" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" fill="#8b949e">HotelReservation — java</text>

  <g font-family="'Courier New',monospace" font-size="15">
    <text x="28" y="76" fill="#56d364" opacity="0">$ java HotelReservation
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.04;0.045;0.95;1" dur="22s" repeatCount="indefinite"/></text>

    <text x="28" y="102" fill="#00d4ff" opacity="0">Welcome to Hotel Reservation Management System
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.115;0.12;0.95;1" dur="22s" repeatCount="indefinite"/></text>

    <text x="28" y="128" fill="#8b949e" opacity="0">[1] Reserve  [2] View  [3] Room No.  [4] Update  [5] Delete  [0] Exit
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.19;0.195;0.95;1" dur="22s" repeatCount="indefinite"/></text>

    <text x="28" y="154" fill="#e6edf3" opacity="0">Choose an option: <tspan fill="#ffd166">1</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.265;0.27;0.95;1" dur="22s" repeatCount="indefinite"/></text>

    <text x="28" y="180" fill="#e6edf3" opacity="0">Enter Guest Name:     <tspan fill="#ffd166">Aarav Sharma</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.34;0.345;0.95;1" dur="22s" repeatCount="indefinite"/></text>

    <text x="28" y="206" fill="#e6edf3" opacity="0">Enter Room Number:    <tspan fill="#ffd166">204</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.415;0.42;0.95;1" dur="22s" repeatCount="indefinite"/></text>

    <text x="28" y="232" fill="#e6edf3" opacity="0">Enter Contact Number: <tspan fill="#ffd166">9876543210</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.49;0.495;0.95;1" dur="22s" repeatCount="indefinite"/></text>

    <text x="28" y="258" fill="#56d364" font-weight="700" opacity="0">✔ Reservation Successful !
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.565;0.57;0.95;1" dur="22s" repeatCount="indefinite"/></text>

    <text x="28" y="284" fill="#e6edf3" opacity="0">Choose an option: <tspan fill="#ffd166">0</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.64;0.645;0.95;1" dur="22s" repeatCount="indefinite"/></text>

    <text x="28" y="310" fill="#b79cff" opacity="0">Thank You for using Hotel Reservation System !!!!
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.715;0.72;0.95;1" dur="22s" repeatCount="indefinite"/></text>

    <!-- blinking cursor -->
    <rect x="28" y="318" width="9" height="3" fill="#e6edf3">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
