<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140" role="img" aria-label="Thanks for visiting" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.5" stop-color="#0f2342"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="ftitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <clipPath id="fround"><rect width="1000" height="140" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#fround)">
    <rect width="1000" height="140" fill="url(#fbg)"/>

    <path fill="#00d4ff" fill-opacity="0.12" d="M0 100 C 200 70, 300 130, 500 100 S 800 70, 1000 100 V140 H0 Z">
      <animate attributeName="d" dur="6s" repeatCount="indefinite"
        values="M0 100 C 200 70, 300 130, 500 100 S 800 70, 1000 100 V140 H0 Z;
                M0 100 C 200 130, 300 70, 500 100 S 800 130, 1000 100 V140 H0 Z;
                M0 100 C 200 70, 300 130, 500 100 S 800 70, 1000 100 V140 H0 Z"/>
    </path>
    <path fill="#8b5cf6" fill-opacity="0.18" d="M0 115 C 250 90, 350 140, 550 115 S 850 90, 1000 115 V140 H0 Z">
      <animate attributeName="d" dur="8s" repeatCount="indefinite"
        values="M0 115 C 250 90, 350 140, 550 115 S 850 90, 1000 115 V140 H0 Z;
                M0 115 C 250 140, 350 90, 550 115 S 850 140, 1000 115 V140 H0 Z;
                M0 115 C 250 90, 350 140, 550 115 S 850 90, 1000 115 V140 H0 Z"/>
    </path>

    <text x="500" y="52" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="28" font-weight="800" fill="url(#ftitle)">
      Thanks for visiting!
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
    </text>

    <text x="500" y="82" text-anchor="middle" font-family="'Courier New',monospace" font-size="16" fill="#9fb3c8">Built with Java · JDBC · MySQL</text>

    <!-- pulsing heart -->
    <g transform="translate(500,100)">
      <path d="M0 8 C -14 -2 -10 -14 0 -6 C 10 -14 14 -2 0 8 Z" fill="#ff4d6d">
        <animateTransform attributeName="transform" type="scale" values="1;1.25;1" dur="1.2s" repeatCount="indefinite" additive="sum"/>
      </path>
    </g>
  </g>
  <rect x="1" y="1" width="998" height="138" rx="18" fill="none" stroke="#00d4ff" stroke-opacity="0.35" stroke-width="2"/>
</svg>
